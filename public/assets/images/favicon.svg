<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: rounded square with indigo-purple gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Graduation cap (mortarboard) -->
  <!-- Top diamond board -->
  <path d="M32 16 L54 26 L32 36 L10 26 Z" fill="#ffffff"/>
  <!-- Cap base (under the board) -->
  <path d="M20 31.5 V40 C20 44 26 47 32 47 C38 47 44 44 44 40 V31.5 L32 37 Z" fill="#e0e7ff"/>
  <!-- Tassel line -->
  <path d="M52 27 V38" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel knot -->
  <circle cx="52" cy="40.5" r="3" fill="#fbbf24"/>
</svg>
